<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delhi Live Bus Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background-color: #f4f4f4; }
        #map { flex-grow: 1; border-bottom: 1px solid #ddd; }
        .controls { background: #fff; padding: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); z-index: 1000; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
        .control-group { display: flex; flex-direction: column; }
        .control-group label { font-size: 12px; color: #555; margin-bottom: 4px; }
        .controls .select2-container { width: 200px !important; }
        .controls button { cursor: pointer; background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; transition: background-color 0.2s; }
        .controls button:hover { background: #0056b3; }

        #toast { visibility: hidden; min-width: 250px; margin-left: -125px; background-color: #333; color: #fff; text-align: center; border-radius: 5px; padding: 16px; position: fixed; z-index: 2000; left: 50%; bottom: 30px; font-size: 16px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        .leaflet-popup-content-wrapper { border-radius: 5px; }
        .schedule-popup h4 { margin: 0 0 10px; font-size: 16px; border-bottom: 1px solid #eee; padding-bottom: 5px;}
        .schedule-popup ul { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
        .schedule-popup li { padding: 4px 0; display: flex; justify-content: space-between; font-size: 14px; }
        .schedule-popup li .route-name { font-weight: bold; color: #007bff; }
        .schedule-popup .no-info { color: #888; }
    </style>
</head>
<body>

<div class="controls">
    <div class="control-group">
        <label for="from-stop">From Stop</label>
        <select id="from-stop"></select>
    </div>
    <div class="control-group">
        <label for="to-stop">To Stop</label>
        <select id="to-stop"></select>
    </div>
    <button onclick="searchRoute()">Find Route</button>

    <div style="border-left: 1px solid #ccc; height: 30px; margin: 0 15px;"></div>

    <div class="control-group">
        <label for="bus-search">Find Bus by Number</label>
        <select id="bus-search"></select>
    </div>
    <button onclick="searchBus()">Search</button>
</div>

<div id="map"></div>
<div id="toast"></div>

<script>
    const map = L.map('map').setView([28.6139, 77.2090], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let busMarkers = {};
    let stopMarkers = L.layerGroup().addTo(map);
    let routePolyline = null;
    let sseSource = null;
    let allStops = [];
    let allRoutes = [];

    // --- UI Initialization ---
    function initializeDropdowns() {
        $('#from-stop, #to-stop').select2({
            placeholder: "Select a stop",
            data: allStops.map(s => ({id: s.stopName, text: s.stopName})).sort((a,b) => a.text.localeCompare(b.text))
        });
        $('#bus-search').select2({
            placeholder: "Select a bus route",
            data: allRoutes.map(r => ({id: r.routeShortName, text: `${r.routeShortName} - ${r.routeLongName}`})).sort((a,b) => a.id.localeCompare(b.id, undefined, {numeric: true}))
        });
    }

    // --- Toast Notification ---
    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.className = "show";
        setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    // --- Data Fetching and Display ---
    async function initialLoad() {
        try {
            const [stopsRes, routesRes] = await Promise.all([
                fetch('/api/gtfs/stops'),
                fetch('/api/gtfs/routes')
            ]);
            if (!stopsRes.ok || !routesRes.ok) throw new Error('Failed to fetch initial data');

            allStops = await stopsRes.json();
            allRoutes = await routesRes.json();

            displayStops(allStops);
            initializeDropdowns();
            connectToSse();

        } catch (error) {
            console.error('Error on initial load:', error);
            showToast('Could not load initial bus data.');
        }
    }

    function displayStops(stops) {
        stopMarkers.clearLayers();
        stops.forEach(stop => {
            const marker = L.circleMarker([stop.stopLat, stop.stopLon], { radius: 5, color: '#2a6496', fillColor: '#3388ff', fillOpacity: 0.8, weight: 1})
                .addTo(stopMarkers);

            marker.on('click', () => fetchStopSchedule(stop, marker));
            marker.bindTooltip(stop.stopName);
        });
    }

    async function fetchStopSchedule(stop, marker) {
        marker.bindPopup(`<div class="schedule-popup"><h4>${stop.stopName}</h4><p>Loading schedule...</p></div>`).openPopup();
        try {
            const response = await fetch(`/api/gtfs/stops/${stop.stopId}/schedule`);
            let content;
            if (response.status === 204 || !response.ok) {
                content = `<p class="no-info">No schedule information available for this stop.</p>`;
            } else {
                const schedule = await response.json();
                const scheduleItems = schedule.map(item =>
                    `<li><span class="route-name">${item.routeName}</span> <span>${item.arrivalTime}</span></li>`
                ).join('');
                content = `<ul>${scheduleItems}</ul>`;
            }
            marker.setPopupContent(`<div class="schedule-popup"><h4>${stop.stopName}</h4>${content}</div>`);
        } catch (error) {
            console.error('Error fetching schedule:', error);
            marker.setPopupContent(`<div class="schedule-popup"><h4>${stop.stopName}</h4><p class="no-info">Could not load schedule.</p></div>`);
        }
    }


    function connectToSse() {
        if (sseSource) sseSource.close();
        sseSource = new EventSource('/api/sse/vehicles');
        sseSource.onmessage = event => updateBusMarkers(JSON.parse(event.data));
        sseSource.onerror = () => showToast('Live connection failed. Reconnecting...');
    }

    function updateBusMarkers(vehicles) {
        const receivedBusIds = new Set();
        vehicles.forEach(vehicle => {
            const busId = vehicle.id;
            receivedBusIds.add(busId);
            const pos = [vehicle.latitude, vehicle.longitude];
            const popupContent = `<b>Bus ID:</b> ${vehicle.id}<br><b>Route:</b> ${vehicle.routeId || 'N/A'}<br><button onclick="subscribeToBus('${busId}')">Notify Me</button>`;

            if (busMarkers[busId]) {
                busMarkers[busId].setLatLng(pos).setPopupContent(popupContent);
            } else {
                busMarkers[busId] = L.marker(pos).bindPopup(popupContent).addTo(map);
            }
        });

        Object.keys(busMarkers).forEach(busId => {
            if (!receivedBusIds.has(busId)) {
                map.removeLayer(busMarkers[busId]);
                delete busMarkers[busId];
            }
        });
    }

    // --- User Actions ---
    async function searchRoute() {
        const from = $('#from-stop').val();
        const to = $('#to-stop').val();
        if (!from || !to) {
            showToast("Please select both 'From' and 'To' stops.");
            return;
        }

        if (routePolyline) map.removeLayer(routePolyline);

        try {
            const response = await fetch(`/api/transit/route?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);
            if (response.status === 404) {
                 showToast(`Stops not found. Please check spelling.`);
                 return;
            }
            if (!response.ok) throw new Error('Route search failed on the server.');

            const route = await response.json();
            if (!route || route.length === 0) {
                showToast(`No direct route found between ${from} and ${to}.`);
                return;
            }
            const latlngs = route.map(stop => [stop.stopLat, stop.stopLon]);
            routePolyline = L.polyline(latlngs, { color: 'red' }).addTo(map);
            map.fitBounds(routePolyline.getBounds());
        } catch (error) {
            console.error('Error searching for route:', error);
            showToast('An error occurred while searching for the route.');
        }
    }

    async function searchBus() {
        const query = $('#bus-search').val();
        if (!query) {
            showToast('Please select a bus number to search.');
            return;
        }
        // Since we have all routes, we can just highlight live buses on that route
        let foundBuses = false;
        Object.values(busMarkers).forEach(marker => {
            const popupText = marker.getPopup().getContent();
            if(popupText.includes(`<b>Route:</b> ${query}`)){
                 marker.openPopup();
                 map.setView(marker.getLatLng(), 14);
                 foundBuses = true;
            }
        });

        if(!foundBuses) {
             showToast(`No live buses found for route ${query} at the moment.`);
        }
    }

    async function subscribeToBus(vehicleId) {
        try {
            const response = await fetch('/api/transit/notifications/subscribe', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ vehicleId: vehicleId })
            });
            if (!response.ok) throw new Error('Subscription failed');
            showToast(`Subscribed to notifications for bus ${vehicleId}`);
        } catch (error) {
            console.error('Subscription error:', error);
            showToast(`Failed to subscribe to bus ${vehicleId}`);
        }
    }

    // --- Initial Load ---
    initialLoad();

</script>
</body>
</html>
