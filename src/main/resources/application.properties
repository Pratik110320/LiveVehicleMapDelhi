# H2 Database
spring.datasource.url=jdbc:h2:file:./transit.db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Redis Configuration (replace with your Redis server details)
spring.redis.host=localhost
spring.redis.port=6379

# Actuator
management.endpoints.web.exposure.include=health,info

# -- Application Specific Configuration --

# GTFS Realtime Feed URL
# IMPORTANT: Replace this placeholder with the actual GTFS-RT feed for Delhi
gtfs.realtime.url=https://www.orangeway.in/api/gtfs-rt/vehicle-positions

# Scheduler configuration
app.scheduling.vehicle-fetch-rate=15000 # in milliseconds (e.g., 15 seconds)

# Security Configuration
app.security.rate-limit=20 # requests per minute per IP
