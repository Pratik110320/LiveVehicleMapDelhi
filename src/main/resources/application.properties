spring.application.name=Live-Vehicle-Map-Delhi

Server Configuration
server.port=8080


#otd.realtime.url=https://otd.delhi.gov.in/api/realtime/VehiclePositions.pb?key=l20yfRg0FOToEYQULSBcceklVgxvLPQ1
#otd.realtime.poll.ms=15000

# Use an environment variable for the API key to avoid committing it to version control
otd.realtime.url=${OTD_REALTIME_URL}

# Database Configuration
spring.datasource.url=jdbc:sqlite:transit.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# Allow specific origins for CORS instead of a wildcard
app.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080

# Database Connection Pool Tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Actuator Endpoints Exposure
management.endpoints.web.exposure.include=health,info,metrics
ernate.order_inserts=true

spring.jpa.hibernate.ddl-auto=update
